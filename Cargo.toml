[package]
name = "claviron-tools"
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
description = "Shared utilities for Claviron operator and client tools"
documentation = "https://docs.rs/claviron-tools"
keywords = ["claviron", "configuration", "cli"]
categories = ["development-tools"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[dependencies]

# ── Claviron packages ────────────────────────────────────────────────
claviron = { workspace = true, optional = true }
claviron-acme = { workspace = true, optional = true }

# ── Async runtime & primitives ───────────────────────────────────────
tokio = { workspace = true, optional = true, features = ["fs"] }

# ── Serialization & parsing ──────────────────────────────────────────
serde = { workspace = true, optional = true, features = ["derive"] }
serde_yaml = { workspace = true, optional = true }

# ── Database backends ────────────────────────────────────────────────
sqlx = { workspace = true, optional = true, features = ["postgres", "runtime-tokio"] }

# ── System & filesystem ──────────────────────────────────────────────
dirs = { workspace = true, optional = true }

# ── Logging & diagnostics ────────────────────────────────────────────
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = []
config = ["dep:claviron", "dep:dirs", "dep:serde", "dep:serde_yaml", "dep:tokio"]
acme = ["config", "dep:claviron-acme"]
db = ["config", "dep:sqlx", "tokio/time"]
sqlite = ["db", "sqlx/sqlite"]

[workspace]
members = [
    "crates/acme",
    "crates/cert",
    "crates/client",
    "crates/hosting",
]
default-members = [
    ".",
    "crates/acme",
    "crates/cert",
    "crates/client",
    "crates/hosting",
]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.24.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/tools"
homepage = "https://github.com/claviron"
# Releases, including alpha versions, are published to crates.io.
publish = true

[workspace.dependencies]

# ── Workspace crates ─────────────────────────────────────────────────
claviron-tools = { path = ".", version = "0.2.0-alpha.24.1", default-features = false }

# ── Claviron packages ────────────────────────────────────────────────
claviron = { version = "0.2.0-alpha.24", default-features = false }
claviron-acme = { version = "0.2.0-alpha.24", default-features = false }

# ── Async runtime & primitives ───────────────────────────────────────
tokio = "1"

# ── CLI & environment ────────────────────────────────────────────────
clap = "4.6"
colored = "3"
dialoguer = "0.12"
dotenvy = "0.15"

# ── Serialization & parsing ──────────────────────────────────────────
serde = "1"
serde_json = "1.0"
serde_yaml = "0.9"

# ── HTTP core ────────────────────────────────────────────────────────
hyper = "1.11"
hyper-util = "0.1"

# ── gRPC & Protobuf ──────────────────────────────────────────────────
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }

# ── TLS & certificates ───────────────────────────────────────────────
hyper-rustls = { version = "0.27", default-features = false }
rcgen = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false }
x509-parser = "0.18"

# ── Cryptography & encoding ──────────────────────────────────────────
base64 = "0.23.1"
p256 = { version = "0.14.0", default-features = false }
rsa = { version = "0.9", default-features = false }

# ── Database backends ────────────────────────────────────────────────
sqlx = { version = "0.9", default-features = false }

# ── System & filesystem ──────────────────────────────────────────────
dirs = "7.0"
nix = "0.31"
tempfile = "3"

# ── Networking utilities ─────────────────────────────────────────────
url = "2"

# ── Time & identifiers ───────────────────────────────────────────────
humantime = "2.3"
time = "0.3"
uuid = "1"

# ── Logging & diagnostics ────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = "0.3"
