[package]
autotests = false
name = "claviron-cert"
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
description = "Claviron local certificate generation and inspection tool"
documentation = "https://docs.rs/claviron-cert"
keywords = ["tls", "mtls", "certificates", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[features]
default = []
hosting = ["claviron/hosting", "claviron/postgres", "claviron-tools/db", "dep:tokio"]
sqlite = ["hosting", "claviron/sqlite", "claviron-tools/sqlite"]

[dependencies]
claviron = { workspace = true, features = ["ssl"] }
claviron-tools.workspace = true
clap.workspace = true
dotenvy.workspace = true
nix.workspace = true
dirs.workspace = true
serde.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
serde_yaml.workspace = true
tempfile = "3"

[[bin]]
name = "claviron-cert"
path = "src/main.rs"
