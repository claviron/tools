[package]
autotests = false
name = "claviron-cert"
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
description = "Claviron local certificate generation and inspection tool"
documentation = "https://docs.rs/claviron-cert"
keywords = ["tls", "mtls", "certificates", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[features]
default = []
hosting = ["claviron/hosting", "claviron/postgres", "claviron-tools/db", "dep:tokio"]
sqlite = ["hosting", "claviron/sqlite", "claviron-tools/sqlite"]

[dependencies]

# ── Claviron packages ────────────────────────────────────────────────
claviron = { workspace = true, features = ["ssl"] }
claviron-tools.workspace = true

# ── Async runtime & primitives ───────────────────────────────────────
tokio = { workspace = true, optional = true, features = ["rt"] }

# ── CLI & environment ────────────────────────────────────────────────
clap = { workspace = true, features = ["derive", "env"] }
dotenvy.workspace = true

# ── System & filesystem ──────────────────────────────────────────────
nix = { workspace = true, features = ["fs", "user"] }
tempfile.workspace = true

# ── Time & identifiers ───────────────────────────────────────────────
time.workspace = true

[dev-dependencies]

# ── Serialization & parsing ──────────────────────────────────────────
serde_yaml.workspace = true

[[bin]]
name = "claviron-cert"
path = "src/main.rs"
