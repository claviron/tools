[package]
name = "claviron-client"
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
autotests = false
description = "Claviron gRPC control-plane client"
documentation = "https://docs.rs/claviron-client"
keywords = ["grpc", "mtls", "claviron", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "proto/*.proto", "build.rs", "Cargo.toml", "README.md", "LICENSE-*"]

[dependencies]

# ── Claviron packages ────────────────────────────────────────────────
claviron = { workspace = true, features = ["ssl"] }
claviron-tools = { workspace = true, features = ["config"] }

# ── Async runtime & primitives ───────────────────────────────────────
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

# ── CLI & environment ────────────────────────────────────────────────
clap = { workspace = true, features = ["derive", "env"] }
dotenvy.workspace = true

# ── Serialization & parsing ──────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
serde_yaml.workspace = true

# ── HTTP core ────────────────────────────────────────────────────────
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"] }

# ── gRPC & Protobuf ──────────────────────────────────────────────────
prost.workspace = true
prost-types.workspace = true
tonic = { workspace = true, features = ["channel", "codegen"] }
tonic-prost.workspace = true

# ── TLS & certificates ───────────────────────────────────────────────
hyper-rustls = { workspace = true, features = ["aws-lc-rs", "http2", "logging", "tls12"] }
rustls = { workspace = true, features = ["aws_lc_rs", "logging", "std", "tls12"] }

# ── Time & identifiers ───────────────────────────────────────────────
time = { workspace = true, features = ["formatting"] }
uuid.workspace = true

# ── Logging & diagnostics ────────────────────────────────────────────
tracing.workspace = true

[build-dependencies]

# ── gRPC & Protobuf ──────────────────────────────────────────────────
tonic-prost-build = { workspace = true, features = ["transport"] }

[[bin]]
name = "claviron-client"
path = "src/main.rs"
