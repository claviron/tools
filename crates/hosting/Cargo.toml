[package]
autotests = false
name = "claviron-hosting-cli"
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
description = "Claviron hosting DB and certificate management CLI"
documentation = "https://docs.rs/claviron-hosting-cli"
keywords = ["tls", "certificates", "database", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[dependencies]

# ── Claviron packages ────────────────────────────────────────────────
claviron = { workspace = true, features = ["hosting", "postgres", "sqlite"] }
claviron-acme = { workspace = true, features = ["postgres", "sqlite"] }
claviron-tools = { workspace = true, features = ["acme", "db", "sqlite"] }

# ── Async runtime & primitives ───────────────────────────────────────
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }

# ── CLI & environment ────────────────────────────────────────────────
clap = { workspace = true, features = ["derive", "env"] }
colored.workspace = true
dialoguer.workspace = true
dotenvy.workspace = true

# ── Serialization & parsing ──────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

# ── TLS & certificates ───────────────────────────────────────────────
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["std"] }
x509-parser.workspace = true

# ── Cryptography & encoding ──────────────────────────────────────────
base64.workspace = true
p256 = { workspace = true, features = ["arithmetic", "pem", "pkcs8"] }
rsa = { workspace = true, features = ["pem", "u64_digit"] }

# ── Networking utilities ─────────────────────────────────────────────
url.workspace = true

# ── Time & identifiers ───────────────────────────────────────────────
time.workspace = true

# ── Logging & diagnostics ────────────────────────────────────────────
tracing.workspace = true

[dev-dependencies]

# ── Database backends ────────────────────────────────────────────────
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }

# ── System & filesystem ──────────────────────────────────────────────
tempfile.workspace = true

[[bin]]
name = "claviron-hosting"
path = "src/main.rs"
