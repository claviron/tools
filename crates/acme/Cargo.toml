[package]
name = "claviron-acme-cli"
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
description = "Claviron ACME account and certificate CLI"
documentation = "https://docs.rs/claviron-acme-cli"
keywords = ["acme", "tls", "certificates", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[dependencies]
claviron = { workspace = true, features = ["ssl"] }
claviron-acme.workspace = true
claviron-tools = { workspace = true, features = ["acme"] }
clap.workspace = true
colored.workspace = true
dotenvy.workspace = true
humantime.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true

[[bin]]
name = "claviron-acme"
path = "src/main.rs"
